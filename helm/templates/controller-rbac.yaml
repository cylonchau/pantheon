{{- if .Values.controller.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.labels.app }}-controller
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.labels.app }}-controller
    {{- toYaml .Values.labels.extraLabels | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.labels.app }}-controller-role
  labels:
    app: {{ .Values.labels.app }}-controller
    {{- toYaml .Values.labels.extraLabels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.labels.app }}-controller-binding
  labels:
    app: {{ .Values.labels.app }}-controller
    {{- toYaml .Values.labels.extraLabels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.labels.app }}-controller-role
subjects:
  - kind: ServiceAccount
    name: {{ .Values.labels.app }}-controller
    namespace: {{ .Values.namespace }}
{{- end }}
